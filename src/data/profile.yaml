about: >-
  At UMass Amherst I estimate blood pressure from graphene electronic tattoos with
  the Kireev Lab, and I reconstruct industrial controller behavior from process
  sensors with Bosch Research. Before that, at WPI, I built LLaSA, a language model
  that reasons about human activity from IMU data, and JOLT, a training method that
  keeps early-exit networks within a compute budget. Before my PhD I spent two and
  a half years shipping speech and conversational AI at Hishab.

# Research directions, in display order. kind "application" is a problem area,
# kind "method" is a supporting technique. The hero trace draws one segment each.
directions:
  - id: health
    kind: application
    title: Wearable health sensing
    trace: pulse
    label: Health
    summary: >-
      Estimating physiological state that a wearable cannot measure directly, with
      models a clinician can inspect.
    body: >-
      With the Kireev Lab at UMass Amherst, I am building physics-informed neural
      networks that estimate blood pressure from graphene electronic tattoo patches,
      to track blood pressure continuously without a cuff. Our PhysioNet
      Challenge 2026 entry screens for future cognitive impairment from overnight
      sleep studies using interpretable sleep features. It reaches 0.77
      age-conditioned AUROC when tested on hospitals it was not trained on. Earlier, I predicted hypoxemia severity in
      hospital in-patients from the photoplethysmograph.
  - id: cps
    kind: application
    title: Industrial cyber-physical systems
    trace: square
    label: Machines
    summary: >-
      Finding faults in industrial control software from the plant's sensor data,
      without instrumenting the controller.
    body: >-
      With Bosch Research, I reconstruct the branch-level program execution trace of an
      industrial controller
      from the plant's process sensors alone, so faults in control software can be
      localized without adding logging to the deployed controller. On a Bosch
      ctrlX testbed it detects code-path faults that sensor readings alone cannot
      reveal at 0.99 AUC and names the faulty function 69% of the time. During my Bosch
      internship I built a contrastive model linking four modalities from a
      manufacturing process (vision, sensor, program trace and text data) for
      language-guided few-shot state classification.
  - id: language
    kind: method
    title: Explaining sensor data in language
    trace: motion
    label: Language
    summary: >-
      Making a model's reading of sensor data inspectable by letting people ask
      about it in plain language.
    body: >-
      LLaSA pairs an IMU encoder with a language model so it can answer open-ended
      questions about human activity from raw accelerometer and gyroscope data, and
      it outperforms GPT-3.5 and GPT-4o-mini on these tasks. We released the
      SensorCap and OpenSQA datasets, with 35,960 captions and 199,701 question
      and answer pairs. Concord studies when
      to trust LLM judges, using agreement among several judges as an uncertainty
      signal. This builds on two and a half years of production conversational AI
      and speech recognition for Bengali speakers.
  - id: on-device
    kind: method
    title: Efficient inference on the device
    trace: sleep
    label: On-device
    summary: >-
      Keeping these models within the battery and latency limits of wearables and
      embedded hardware.
    body: >-
      JOLT trains early-exit networks so that each exit's confidence tracks which
      inputs it gets right, then routes on that confidence to hold a stated compute
      budget even when the input distribution shifts. Across seven sensor, image,
      audio and language datasets it ranks first of eleven methods. At WPI I was also a
      teaching assistant for the graduate course On-Device Deep Learning.

research_interests: >-
  Interpretable and physics-informed machine learning for sensor data; wearable
  health sensing, including cuffless blood pressure and sleep-based cognitive
  screening; industrial cyber-physical systems; language models grounded in sensor
  data; efficient on-device inference.
research_interests_health: >-
  Interpretable and physics-informed machine learning for wearable health sensing;
  cuffless blood pressure estimation; sleep-based cognitive screening; biosignals
  (PPG, bioimpedance, IMU); language models grounded in sensor data; efficient
  on-device inference; industrial cyber-physical systems.
research_interests_cps: >-
  Interpretable machine learning for industrial cyber-physical systems; fault
  diagnosis from process sensors; multimodal learning across sensors, program
  traces, video and text; physics-informed time-series modeling; efficient
  on-device inference; wearable health sensing.

