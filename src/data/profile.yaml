about: >-
  My research is about making sensor data useful on the devices that collect it.
  At UMass Amherst I estimate blood pressure from graphene electronic tattoos with
  the Kireev Lab, and I reconstruct industrial controller behavior from process
  sensors with Bosch Research. Before that, at WPI, I built LLaSA, a language model
  that reasons about human activity from IMU data, and JOLT, a training method that
  keeps early-exit networks within a compute budget. Before my PhD I spent two and
  a half years shipping speech and conversational AI at Hishab.

# The hero trace: one segment per direction, left to right.
directions:
  - id: health
    title: Continuous physiological monitoring
    trace: pulse
    label: Physiology
    summary: >-
      Estimating vital signs and health risk from signals that wearables can record
      all day, with models whose behavior a clinician can inspect.
    body: >-
      With the Kireev Lab at UMass Amherst, I am building physics-informed neural
      networks that estimate blood pressure from graphene electronic tattoo patches,
      so blood pressure can be tracked continuously without a cuff. Our PhysioNet
      Challenge 2026 entry screens for future cognitive impairment from overnight
      sleep studies using interpretable sleep features, and tests whether they
      hold up across clinical sites. Earlier, I predicted hypoxemia severity in
      hospital in-patients from the photoplethysmograph.
  - id: language
    title: Language models that read sensor data
    trace: motion
    label: Sensor language
    summary: >-
      Letting people ask questions about what a wearable recorded, and get answers
      grounded in the signal rather than guessed.
    body: >-
      LLaSA pairs an IMU encoder with a language model so it can answer open-ended
      questions about human activity from raw accelerometer and gyroscope data; we
      released the SensorCaps and OpenSQA datasets with it. Concord studies when
      to trust LLM judges, using agreement among several judges as an uncertainty
      signal. This builds on two and a half years of production conversational AI
      and speech recognition for Bengali speakers.
  - id: on-device
    title: Efficient inference on the device
    trace: sleep
    label: On-device
    summary: >-
      Spending compute only where an input needs it, so models fit the battery and
      latency limits of wearables and embedded hardware.
    body: >-
      JOLT trains early-exit networks so that each exit's confidence tracks which
      inputs it gets right, then routes on that confidence to hold a stated compute
      budget even when the input distribution shifts. Across seven sensor, image,
      audio and language datasets it ranks first of eleven methods. I also teach in
      the graduate course On-Device Deep Learning.
  - id: cps
    title: Industrial cyber-physical systems
    trace: square
    label: Machines
    summary: >-
      Applying the same sensor-first methods to machines: diagnosing industrial
      controllers from what their plants physically do.
    body: >-
      At Bosch Research I built a contrastive model that links four modalities from
      a manufacturing process (video, sensors, program execution traces and text)
      for language-guided few-shot state classification. The follow-up work
      reconstructs a controller's branch-level execution trace from plant sensors
      alone, so faults can be debugged without instrumenting the controller.

